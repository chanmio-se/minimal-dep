<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Go + HTMX フレームワークのアーキテクチャ概要</title>
  <desc id="diagram-desc">ブラウザと HTMX からのリクエストが、ミドルウェアを備えた net/http.ServeMux に届きます。単一の Go バイナリ内で、コンポジションルートが機能モジュールを明示的に組み立てます。各モジュールは公開 api だけを他モジュールに公開し、技術的共通機能は platform に集約します。画面表示のレスポンスは JSON ではなく、完全な HTML または HTML フラグメントです。archlint、テスト、CI、ロックファイルが設計を継続的に検証します。</desc>

  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <style>
    text { font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, Inter, -apple-system, "Segoe UI", sans-serif; }
  </style>

  <rect width="1440" height="1020" fill="url(#page)"/>

  <!-- ヘッダー -->
  <text x="60" y="44" font-size="13" font-weight="700" letter-spacing="2.4" fill="#2563eb">アーキテクチャ概要</text>
  <text x="60" y="82" font-size="31" font-weight="700" fill="#0f172a">Go + HTMX Web Framework</text>
  <text x="60" y="108" font-size="15" fill="#475569">サーバーサイドレンダリングの MPA  ·  HTMX による部分更新  ·  Go 標準ライブラリ中心  ·  単一バイナリ</text>

  <!-- クライアント -->
  <g filter="url(#shadow)">
    <rect x="60" y="130" width="300" height="140" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="390" y="130" width="300" height="140" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <rect x="76" y="146" width="86" height="22" rx="11" fill="#dbeafe"/>
  <text x="119" y="161" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">クライアント</text>
  <text x="76" y="198" font-size="19" font-weight="700" fill="#0f172a">ブラウザ（MPA）</text>
  <text x="76" y="224" font-size="13" fill="#475569">通常はページ全体を表示</text>
  <text x="76" y="246" font-size="13" fill="#475569">フォームは通常送信にフォールバック</text>

  <rect x="406" y="146" width="106" height="22" rx="11" fill="#ffedd5"/>
  <text x="459" y="161" text-anchor="middle" font-size="10" font-weight="700" fill="#c2410c">HTMX 拡張</text>
  <text x="406" y="198" font-size="19" font-weight="700" fill="#0f172a">HTMX</text>
  <text x="406" y="224" font-size="13" fill="#475569">HX-Request: true</text>
  <text x="406" y="246" font-size="13" fill="#475569">hx-target / hx-swap</text>

  <!-- レスポンス方針 -->
  <g filter="url(#shadow)">
    <rect x="720" y="130" width="660" height="140" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <rect x="740" y="146" width="152" height="22" rx="11" fill="#dcfce7"/>
  <text x="816" y="161" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">レスポンス方針</text>
  <text x="740" y="195" font-size="18" font-weight="700" fill="#0f172a">JSON ではなく HTML</text>
  <rect x="740" y="205" width="300" height="50" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="756" y="226" font-size="12.5" font-weight="700" fill="#1d4ed8">通常リクエスト</text>
  <text x="756" y="244" font-size="11.5" fill="#334155">layouts/app.html + pages/tasks.html</text>
  <rect x="1060" y="205" width="300" height="50" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="1076" y="226" font-size="12.5" font-weight="700" fill="#c2410c">HTMX リクエスト</text>
  <text x="1076" y="244" font-size="11.5" fill="#334155">fragments/tasks-list.html</text>

  <!-- HTTP 境界へのリクエスト -->
  <line x1="210" y1="270" x2="210" y2="298" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="222" y="288" font-size="11" fill="#64748b">GET /tasks</text>
  <line x1="540" y1="270" x2="540" y2="298" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="552" y="288" font-size="11" fill="#64748b">GET /tasks + HX-Request</text>

  <!-- HTTP 境界 -->
  <rect x="60" y="300" width="1320" height="66" rx="14" fill="url(#edge)"/>
  <text x="84" y="326" font-size="11" font-weight="700" letter-spacing="1.6" fill="#93c5fd">HTTP 境界</text>
  <text x="84" y="348" font-size="16" font-weight="700" fill="#ffffff">net/http.ServeMux</text>
  <g font-size="11.5" fill="#e2e8f0" text-anchor="middle">
    <rect x="340" y="316" width="120" height="34" rx="9" fill="#334155" stroke="#475569"/><text x="400" y="338">リクエスト ID</text>
    <rect x="472" y="316" width="124" height="34" rx="9" fill="#334155" stroke="#475569"/><text x="534" y="338">アクセスログ</text>
    <rect x="608" y="316" width="110" height="34" rx="9" fill="#334155" stroke="#475569"/><text x="663" y="338">パニック復旧</text>
    <rect x="730" y="316" width="160" height="34" rx="9" fill="#334155" stroke="#475569"/><text x="810" y="338">セキュリティヘッダー</text>
    <rect x="902" y="316" width="90" height="34" rx="9" fill="#334155" stroke="#475569"/><text x="947" y="338">CSRF</text>
    <rect x="1004" y="316" width="110" height="34" rx="9" fill="#334155" stroke="#475569"/><text x="1059" y="338">認証</text>
    <rect x="1126" y="316" width="228" height="34" rx="9" fill="#334155" stroke="#475569"/><text x="1240" y="338">タイムアウト / サイズ制限</text>
  </g>

  <!-- アプリケーション境界 -->
  <rect x="60" y="395" width="1320" height="350" rx="20" fill="#f8fbff" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="690" y="379" width="338" height="30" rx="15" fill="#2563eb"/>
  <text x="859" y="399" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1" fill="#ffffff">単一 Go バイナリ · モジュラーモノリス</text>

  <!-- HTTP 境界からコンポジションルートへ -->
  <line x1="230" y1="366" x2="230" y2="448" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- コンポジションルート -->
  <g filter="url(#shadow)">
    <rect x="90" y="450" width="280" height="270" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <rect x="90" y="450" width="5" height="270" rx="2" fill="#2563eb"/>
  <text x="110" y="484" font-size="18" font-weight="700" fill="#0f172a">internal/app</text>
  <text x="110" y="506" font-size="13" font-weight="600" fill="#2563eb">コンポジションルート</text>
  <line x1="110" y1="520" x2="350" y2="520" stroke="#e2e8f0"/>
  <g font-size="12.5" fill="#334155">
    <circle cx="116" cy="542" r="3" fill="#2563eb"/><text x="128" y="546">モジュールを生成</text>
    <circle cx="116" cy="570" r="3" fill="#2563eb"/><text x="128" y="574">依存関係を注入</text>
    <circle cx="116" cy="598" r="3" fill="#2563eb"/><text x="128" y="602">ルートを明示的に登録</text>
    <circle cx="116" cy="626" r="3" fill="#2563eb"/><text x="128" y="630">起動・終了を管理</text>
  </g>
  <rect x="110" y="662" width="142" height="28" rx="14" fill="#eff6ff"/>
  <text x="181" y="680" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1d4ed8">暗黙より明示を優先</text>

  <!-- コンポジションルートからモジュールへ -->
  <line x1="370" y1="585" x2="398" y2="585" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="384" y="575" text-anchor="middle" font-size="10" fill="#64748b">組み立て</text>

  <!-- 機能モジュール -->
  <rect x="400" y="450" width="590" height="270" rx="14" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="416" y="476" font-size="11" font-weight="700" letter-spacing="1.4" fill="#7e22ce">機能モジュール</text>

  <g filter="url(#shadow)">
    <rect x="414" y="486" width="284" height="222" rx="10" fill="#ffffff" stroke="#ddd6fe"/>
    <rect x="716" y="486" width="284" height="222" rx="10" fill="#ffffff" stroke="#ddd6fe"/>
  </g>
  <rect x="414" y="486" width="284" height="32" rx="10" fill="#ede9fe"/>
  <rect x="414" y="508" width="284" height="10" fill="#ede9fe"/>
  <text x="428" y="507" font-size="15" font-weight="700" fill="#6b21a8">tasks</text>
  <rect x="716" y="486" width="284" height="32" rx="10" fill="#ede9fe"/>
  <rect x="716" y="508" width="284" height="10" fill="#ede9fe"/>
  <text x="730" y="507" font-size="15" font-weight="700" fill="#6b21a8">identity</text>

  <g>
    <!-- tasks のレイヤー -->
    <g font-size="12.5" fill="#334155">
      <rect x="414" y="518" width="284" height="31" fill="#fafafa"/><rect x="426" y="527" width="6" height="13" rx="3" fill="#7c3aed"/><text x="442" y="538">api</text><text x="686" y="538" text-anchor="end" font-size="10" fill="#94a3b8">公開契約</text>
      <rect x="414" y="549" width="284" height="31" fill="#ffffff"/><rect x="426" y="558" width="6" height="13" rx="3" fill="#7c3aed"/><text x="442" y="569">handler</text><text x="686" y="569" text-anchor="end" font-size="10" fill="#94a3b8">HTTP 入出力</text>
      <rect x="414" y="580" width="284" height="31" fill="#fafafa"/><rect x="426" y="589" width="6" height="13" rx="3" fill="#7c3aed"/><text x="442" y="600">usecase</text><text x="686" y="600" text-anchor="end" font-size="10" fill="#94a3b8">ユースケース</text>
      <rect x="414" y="611" width="284" height="31" fill="#ffffff"/><rect x="426" y="620" width="6" height="13" rx="3" fill="#7c3aed"/><text x="442" y="631">domain</text><text x="686" y="631" text-anchor="end" font-size="10" fill="#94a3b8">業務ルール</text>
      <rect x="414" y="642" width="284" height="31" fill="#fafafa"/><rect x="426" y="651" width="6" height="13" rx="3" fill="#7c3aed"/><text x="442" y="662">repository</text><text x="686" y="662" text-anchor="end" font-size="10" fill="#94a3b8">永続化</text>
      <rect x="414" y="673" width="284" height="31" fill="#ffffff"/><rect x="426" y="682" width="6" height="13" rx="3" fill="#7c3aed"/><text x="442" y="693">templates</text><text x="686" y="693" text-anchor="end" font-size="10" fill="#94a3b8">HTML 表示</text>
    </g>
    <!-- identity のレイヤー -->
    <g font-size="12.5" fill="#334155">
      <rect x="716" y="518" width="284" height="31" fill="#fafafa"/><rect x="728" y="527" width="6" height="13" rx="3" fill="#7c3aed"/><text x="744" y="538">api</text><text x="988" y="538" text-anchor="end" font-size="10" fill="#94a3b8">公開契約</text>
      <rect x="716" y="549" width="284" height="31" fill="#ffffff"/><rect x="728" y="558" width="6" height="13" rx="3" fill="#7c3aed"/><text x="744" y="569">handler</text><text x="988" y="569" text-anchor="end" font-size="10" fill="#94a3b8">HTTP 入出力</text>
      <rect x="716" y="580" width="284" height="31" fill="#fafafa"/><rect x="728" y="589" width="6" height="13" rx="3" fill="#7c3aed"/><text x="744" y="600">usecase</text><text x="988" y="600" text-anchor="end" font-size="10" fill="#94a3b8">ユースケース</text>
      <rect x="716" y="611" width="284" height="31" fill="#ffffff"/><rect x="728" y="620" width="6" height="13" rx="3" fill="#7c3aed"/><text x="744" y="631">domain</text><text x="988" y="631" text-anchor="end" font-size="10" fill="#94a3b8">業務ルール</text>
      <rect x="716" y="642" width="284" height="31" fill="#fafafa"/><rect x="728" y="651" width="6" height="13" rx="3" fill="#7c3aed"/><text x="744" y="662">repository</text><text x="988" y="662" text-anchor="end" font-size="10" fill="#94a3b8">永続化</text>
      <rect x="716" y="673" width="284" height="31" fill="#ffffff"/><rect x="728" y="682" width="6" height="13" rx="3" fill="#7c3aed"/><text x="744" y="693">templates</text><text x="988" y="693" text-anchor="end" font-size="10" fill="#94a3b8">HTML 表示</text>
    </g>
  </g>

  <!-- モジュールから platform へ -->
  <line x1="990" y1="585" x2="1018" y2="585" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <text x="1004" y="575" text-anchor="middle" font-size="10" fill="#64748b">利用</text>

  <!-- 技術的共通機能 -->
  <g filter="url(#shadow)">
    <rect x="1020" y="450" width="330" height="270" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <rect x="1020" y="450" width="5" height="270" rx="2" fill="#16a34a"/>
  <text x="1040" y="484" font-size="18" font-weight="700" fill="#0f172a">internal/platform</text>
  <text x="1040" y="506" font-size="12" font-weight="600" fill="#15803d">技術的共通機能のみ · 業務ルールなし</text>
  <line x1="1040" y1="520" x2="1330" y2="520" stroke="#e2e8f0"/>
  <g font-size="12.5" fill="#334155">
    <rect x="1040" y="538" width="8" height="8" rx="2" fill="#16a34a"/><text x="1058" y="547">http / htmx ヘルパー</text>
    <rect x="1040" y="564" width="8" height="8" rx="2" fill="#16a34a"/><text x="1058" y="573">データベース</text>
    <rect x="1040" y="590" width="8" height="8" rx="2" fill="#16a34a"/><text x="1058" y="599">レイアウトテンプレート</text>
    <rect x="1040" y="616" width="8" height="8" rx="2" fill="#16a34a"/><text x="1058" y="625">ログ</text>
    <rect x="1040" y="642" width="8" height="8" rx="2" fill="#16a34a"/><text x="1058" y="651">セッション</text>
    <rect x="1040" y="668" width="8" height="8" rx="2" fill="#16a34a"/><text x="1058" y="677">設定</text>
  </g>

  <!-- 永続化 -->
  <line x1="1185" y1="720" x2="1185" y2="773" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <text x="1197" y="751" font-size="11" fill="#64748b">database/sql + sqlc</text>

  <g filter="url(#shadow)">
    <rect x="970" y="775" width="410" height="170" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <text x="994" y="809" font-size="16" font-weight="700" fill="#0f172a">永続化</text>
  <text x="994" y="831" font-size="12" fill="#475569">プレースホルダー · 型付き SQL · マイグレーション</text>
  <path d="M1000 861 C1000 853 1080 853 1080 861 L1080 919 C1080 927 1000 927 1000 919 Z" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <ellipse cx="1040" cy="861" rx="40" ry="9" fill="#bfdbfe" stroke="#60a5fa" stroke-width="2"/>
  <path d="M1000 890 C1000 898 1080 898 1080 890" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="1100" y="881" font-size="16" font-weight="700" fill="#0f172a">SQL データベース</text>
  <text x="1100" y="903" font-size="12" fill="#475569">型変換は Repository が担当</text>

  <!-- 品質ハーネス -->
  <rect x="60" y="775" width="880" height="170" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="84" y="809" font-size="16" font-weight="700" fill="#0f172a">品質ハーネス · フィットネス関数</text>
  <text x="84" y="831" font-size="12" fill="#475569">設計ルールは指示文ではなくコードで検証する</text>
  <g>
    <rect x="84" y="846" width="200" height="78" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="100" y="873" font-size="13" font-weight="700" fill="#1d4ed8">archlint</text>
    <text x="100" y="895" font-size="11" fill="#475569">境界・レイヤールール</text>
    <text x="100" y="912" font-size="11" fill="#475569">承認済み依存関係</text>

    <rect x="296" y="846" width="200" height="78" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="312" y="873" font-size="13" font-weight="700" fill="#1d4ed8">テスト</text>
    <text x="312" y="895" font-size="11" fill="#475569">単体・統合テスト</text>
    <text x="312" y="912" font-size="11" fill="#475569">Handler・E2E / HTMX</text>

    <rect x="508" y="846" width="200" height="78" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="524" y="873" font-size="13" font-weight="700" fill="#1d4ed8">CI</text>
    <text x="524" y="895" font-size="11" fill="#475569">ビルド · vet · lint · test</text>
    <text x="524" y="912" font-size="11" fill="#475569">カスタム golangci-lint</text>

    <rect x="720" y="846" width="200" height="78" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="736" y="873" font-size="13" font-weight="700" fill="#1d4ed8">ロックファイル</text>
    <text x="736" y="895" font-size="11" fill="#475569">actions.lock</text>
    <text x="736" y="912" font-size="11" fill="#475569">npm / htmx 同期</text>
  </g>
  <line x1="500" y1="774" x2="500" y2="747" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-slate)"/>
  <text x="512" y="764" font-size="10" fill="#64748b">検証</text>

  <text x="720" y="980" text-anchor="middle" font-size="13" fill="#94a3b8">標準ライブラリ優先  ·  明示的な依存関係  ·  JSON ではなく HTML  ·  安全な初期値  ·  単一のデプロイ単位</text>
</svg>
