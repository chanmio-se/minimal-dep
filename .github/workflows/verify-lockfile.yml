name: Verify workflow lockfile

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify actions.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: github/gh-actions-lock@verify/v0.5.1
